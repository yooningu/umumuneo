name: CI/CD

on:
  push:
    branches: [main]

jobs:
  # 1) 빌드 체크 - GitHub이 공짜로 제공하는 서버에서 실행됨 (미니피시랑 무관)
  ci:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 테스트용 DB가 CI 환경엔 없어서 컴파일만 확인 (실제 테스트는 나중에 필요하면 추가)
      - name: Backend build
        working-directory: backend
        run: ./gradlew build -x test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build

  # 2) 배포 - 미니피시에 설치된 셀프 호스팅 러너가 실행함 (ci 성공해야만 실행됨)
  deploy:
    name: Deploy to mini PC
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Pull latest code & restart services
        shell: powershell
        run: |
          cd C:\Users\yig07\OneDrive\Desktop\umumuneo
          git fetch origin main
          git reset --hard origin/main

          docker compose up -d --remove-orphans

          # 백엔드: 실행 중인 앱 프로세스만 정확히 골라서 종료 후 재기동 (Gradle 데몬은 안 건드림 - 재빌드 속도 위해 유지)
          docker exec spring-dev sh -c "pkill -9 -f 'com.example.demo.DemoApplication' 2>/dev/null; true"
          docker exec -d spring-dev sh -c "cd /workspace && ./gradlew bootRun > /tmp/backend.log 2>&1"

          # 프론트엔드: vite 개발서버만 종료 후 재기동
          docker exec react-dev sh -c "pkill -9 -f vite 2>/dev/null; true"
          docker exec -d react-dev sh -c "cd /workspace && npm install && npm run dev -- --host > /tmp/frontend.log 2>&1"
