<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liquid Glass — Dark Waves</title>
<style>
	html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
	#c { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';

/* ==================================================================
   Liquid Glass — Dark Waves
   Slow waves of dark liquid glass drifting over pure black.
   Self-contained WebGL wallpaper for Wallpaper Engine.
   Query params (for testing): ?still&t=<seconds>&i=<intensity>
   ================================================================== */

var canvas = document.getElementById('c');
var glOpts = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: true };
var gl = canvas.getContext('webgl', glOpts) || canvas.getContext('experimental-webgl', glOpts);

/* No WebGL -> plain black wallpaper */
if (!gl) return;

gl.getExtension('OES_standard_derivatives');

var VERT = [
	'attribute vec2 aPos;',
	'void main() { gl_Position = vec4(aPos, 0.0, 1.0); }'
].join('\n');

var FRAG = [
'#extension GL_OES_standard_derivatives : enable',
'precision highp float;',
'',
'uniform vec2  uRes;',
'uniform float uTime;',
'uniform float uIntensity;',
'uniform vec3  uTint;',
'uniform vec2  uParallax;',
'',
'/* --- 2D simplex noise (Ashima Arts / Stefan Gustavson) --- */',
'vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }',
'',
'float snoise(vec2 v) {',
'	const vec4 C = vec4(0.211324865405187, 0.366025403784439,',
'	                   -0.577350269189626, 0.024390243902439);',
'	vec2 i  = floor(v + dot(v, C.yy));',
'	vec2 x0 = v - i + dot(i, C.xx);',
'	vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);',
'	vec4 x12 = x0.xyxy + C.xxzz;',
'	x12.xy -= i1;',
'	i = mod(i, 289.0);',
'	vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));',
'	vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);',
'	m = m*m; m = m*m;',
'	vec3 x  = 2.0*fract(p * C.www) - 1.0;',
'	vec3 h  = abs(x) - 0.5;',
'	vec3 ox = floor(x + 0.5);',
'	vec3 a0 = x - ox;',
'	m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);',
'	vec3 g;',
'	g.x  = a0.x  * x0.x  + h.x  * x0.y;',
'	g.yz = a0.yz * x12.xz + h.yz * x12.yw;',
'	return 130.0 * dot(m, g);',
'}',
'',
'const mat2 ROT = mat2(0.80, 0.60, -0.60, 0.80);',
'',
'float fbm(vec2 p) {',
'	float f = 0.0;',
'	float a = 0.55;',
'	for (int i = 0; i < 4; i++) {',
'		f += a * snoise(p);',
'		p = ROT * p * 2.03 + vec2(3.1, 7.7);',
'		a *= 0.52;',
'	}',
'	return f;',
'}',
'',
'/* domain-warped noise field: slow flowing glass waves */',
'float waves(vec2 p, float t) {',
'	vec2 q = vec2(fbm(p + 0.32*vec2( t, -0.8*t)),',
'	              fbm(p + vec2(5.2, 1.3) + 0.28*vec2(-0.6*t, 0.9*t)));',
'	vec2 r = vec2(fbm(p + 1.9*q + vec2(1.7, 9.2) + 0.21*vec2( 0.4*t,  0.5*t)),',
'	              fbm(p + 1.9*q + vec2(8.3, 2.8) + 0.24*vec2(-0.5*t, -0.7*t)));',
'	return fbm(p + 1.7*r + vec2(0.05*t, 0.0));',
'}',
'',
'void main() {',
'	vec2 frag = gl_FragCoord.xy;',
'	vec2 uv = (frag - 0.5*uRes) / uRes.y;',
'	float t = uTime * 0.05;',
'',
'	vec2 p = vec2(uv.x*1.15, uv.y*1.70);',
'	p -= (uParallax - 0.5) * 0.10;',
'',
'	float h = waves(p, t);',
'',
'	/* surface normal from screen-space derivatives,',
'	   rescaled so slopes are resolution-independent */',
'	vec2 grad = vec2(dFdx(h), -dFdy(h)) * (uRes.y * 0.40);',
'	vec3 n = normalize(vec3(-grad, 1.0));',
'',
'	/* soft glass body mask */',
'	float body = smoothstep(-0.22, 0.38, h);',
'',
'	vec3 V  = vec3(0.0, 0.0, 1.0);',
'	vec3 L1 = normalize(vec3(-0.45, 0.60, 0.62));',
'	vec3 L2 = normalize(vec3( 0.55,-0.30, 0.52));',
'',
'	float diff = clamp(dot(n, L1), 0.0, 1.0);',
'	float fres = pow(1.0 - clamp(n.z, 0.0, 1.0), 1.6);',
'	float s1 = pow(clamp(dot(reflect(-L1, n), V), 0.0, 1.0), 20.0);',
'	float s2 = pow(clamp(dot(reflect(-L2, n), V), 0.0, 1.0), 44.0);',
'	float s3 = pow(clamp(dot(reflect(-L1, n), V), 0.0, 1.0),  8.0);',
'',
'	/* iridescent phase: subtle color drift tied to the field */',
'	vec3 irid = 0.5 + 0.5*cos(6.28318*(h*1.7 + vec3(0.00, 0.35, 0.67)));',
'',
'	vec3 col = vec3(0.0);',
'	col += body * diff * vec3(0.085, 0.092, 0.105);   /* glass body shading */',
'	col += body * fres * vec3(0.075, 0.082, 0.098);   /* soft sheen        */',
'	/* silver highlights with a whisper of iridescence */',
'	col += body * (s1*1.05 + s2*0.55 + s3*0.14) * uTint * (0.76 + 0.50*irid);',
'',
'	/* faint iridescence along the wave contours */',
'	float band = smoothstep(-0.22, 0.02, h) * (1.0 - smoothstep(0.02, 0.26, h));',
'	col += band * irid * 0.085;',
'',
'	col *= uIntensity;',
'	col *= 1.0 - 0.20*dot(uv, uv);   /* gentle vignette */',
'',
'	/* dither against banding in near-black gradients */',
'	float dith = fract(sin(dot(frag, vec2(12.9898, 78.233))) * 43758.5453);',
'	col += (dith - 0.5) * (2.0/255.0);',
'',
'	gl_FragColor = vec4(max(col, 0.0), 1.0);',
'}'
].join('\n');

function compile(type, src) {
	var s = gl.createShader(type);
	gl.shaderSource(s, src);
	gl.compileShader(s);
	if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
		console.error(gl.getShaderInfoLog(s));
		return null;
	}
	return s;
}

var vs = compile(gl.VERTEX_SHADER, VERT);
var fs = compile(gl.FRAGMENT_SHADER, FRAG);
if (!vs || !fs) return;

var prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
	console.error(gl.getProgramInfoLog(prog));
	return;
}
gl.useProgram(prog);

var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
var aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

var uRes       = gl.getUniformLocation(prog, 'uRes');
var uTime      = gl.getUniformLocation(prog, 'uTime');
var uIntensity = gl.getUniformLocation(prog, 'uIntensity');
var uTint      = gl.getUniformLocation(prog, 'uTint');
var uParallax  = gl.getUniformLocation(prog, 'uParallax');

/* ------------- user settings (defaults match project.json) ------------- */
var params = {
	speed:     1.0,
	intensity: 1.0,
	tint:      [0.80, 0.84, 0.92],
	fpsCap:    60,
	quality:   'high',
	parallax:  true
};

function hexToRgb(hex) {
	var m = /^#?([0-9a-f]{6})$/i.exec(String(hex));
	if (!m) return null;
	var n = parseInt(m[1], 16);
	return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

/* Wallpaper Engine user properties */
window.wallpaperPropertyListener = {
	applyUserProperties: function (properties) {
		if (properties.speed)     params.speed     = Math.max(0, +properties.speed.value || 0);
		if (properties.intensity) params.intensity = +properties.intensity.value;
		if (properties.tint) {
			var c = hexToRgb(properties.tint.value);
			if (c) params.tint = c;
		}
		if (properties.fpscap)   params.fpsCap   = parseInt(properties.fpscap.value, 10) || 60;
		if (properties.quality)  params.quality  = properties.quality.value;
		if (properties.parallax) params.parallax = !!properties.parallax.value;
	}
};

/* ------------- mouse parallax ------------- */
var mouse = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5 };

/* Wallpaper Engine mouse listener contract */
window.wallpaperRegisterMouseListener = function (callback) {
	window.addEventListener('mousemove', function (e) {
		callback(e.clientX / Math.max(1, window.innerWidth),
		         e.clientY / Math.max(1, window.innerHeight));
	});
};

/* our own tracking (also works in a plain browser) */
window.addEventListener('mousemove', function (e) {
	mouse.x = e.clientX / Math.max(1, window.innerWidth);
	mouse.y = e.clientY / Math.max(1, window.innerHeight);
});

/* ------------- sizing ------------- */
function qualityScale() {
	if (params.quality === 'low')    return 0.5;
	if (params.quality === 'medium') return 0.75;
	return Math.min(window.devicePixelRatio || 1, 2);
}

function resize() {
	var s = qualityScale();
	var w = Math.max(2, Math.round(window.innerWidth  * s));
	var h = Math.max(2, Math.round(window.innerHeight * s));
	if (canvas.width !== w || canvas.height !== h) {
		canvas.width = w;
		canvas.height = h;
		gl.viewport(0, 0, w, h);
	}
}
window.addEventListener('resize', resize);

/* ------------- render loop with fps cap ------------- */
var qp = new URLSearchParams(window.location.search);
var simTime = parseFloat(qp.get('t')) || 0;
if (qp.has('i')) params.intensity = parseFloat(qp.get('i')) || 1.0;
var still = qp.has('still');

var prevTs = 0, lastDraw = -1e9;

function draw() {
	gl.uniform2f(uRes, canvas.width, canvas.height);
	gl.uniform1f(uTime, simTime);
	gl.uniform1f(uIntensity, params.intensity);
	gl.uniform3f(uTint, params.tint[0], params.tint[1], params.tint[2]);
	gl.uniform2f(uParallax, mouse.sx, mouse.sy);
	gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function loop(ts) {
	requestAnimationFrame(loop);
	if (!prevTs) prevTs = ts;

	var minDt = 1000 / params.fpsCap - 1.5;
	if (ts - lastDraw < minDt) return;

	var dt = Math.min((ts - prevTs) / 1000, 0.1);
	prevTs = ts;
	lastDraw = ts;

	simTime += dt * params.speed;

	/* smooth mouse */
	var k = 1 - Math.exp(-dt * 3.0);
	var tx = params.parallax ? mouse.x : 0.5;
	var ty = params.parallax ? mouse.y : 0.5;
	mouse.sx += (tx - mouse.sx) * k;
	mouse.sy += (ty - mouse.sy) * k;

	resize();
	draw();
}

if (still) {
	resize();
	draw();
} else {
	requestAnimationFrame(loop);
}

})();
</script>
</body>
</html>
