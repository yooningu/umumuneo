				{
					this.scale = s;
					this.wrapper.style.transformOrigin = '50% 50%';
					this.wrapper.style.transform = 'translate( ' + this.ox + 'px, ' + this.oy + 'px ) scale(' + (this.scale) + ' )';
				}
				
				this.setPosition = function( x, y )
				{
					this.ox = x;

					this.wrapper.style.transformOrigin = '50% 50%';
					this.wrapper.style.transform = 'translate( ' + this.ox + 'px, ' + this.oy + 'px ) scale(' + (this.scale) + ' )';
				}
				
				this.sepVisible = true;
				this.interval = function() {
					if( !this.visi ) return;
					if( this.sepVisible ) { 
						this.sepLabel.style.display = 'none';
						this.sep2Label.style.display = 'inline-block';
						this.sepVisible = false;
					}
					else  { 
						this.sepLabel.style.display = 'inline-block';
						this.sep2Label.style.display = 'none';
						this.sepVisible = true;
					}
					
					var dt = new Date();
					var h = dt.getHours();
					var m = dt.getMinutes();
					var p = '';
					
					if( this.use12h ) {
						if( h >= 12 ) { 
							p = ' PM';
						}
						else {
							p = ' AM';
						}
						
						h = h % 12;
						if( h == 0 ) h = 12;
					}
					
					if( m < 10 ) m = '0' + m;
					if( h < 10 ) h = '0' + h;
					
					if( h != this.h ) {
						this.h = h;
						this.hourLabel.innerText = h;
					}
					if( m != this.m ) {
						this.m = m;
						this.minuteLabel.innerText = m;
					}
					if( p != this.p ) {
						this.p = p;
						this.postfixLabel.innerText = p;
					}
				}
				
				var self = this;
				setInterval( function() { self.interval(); }, 1000 );
			}
			
			var htmlTime = new digiTime();
			
			function p(x,y,dx,dy)
			{
				this.x = x;
				this.y = y;
				this.dx = dx;
				this.dy = dy;
				this.lifetime = 1;
			}
			
			function ps()
			{
				this.nextIdx = 0;
				this.maxParticles = 50;
				this.ps = [];
				
				this.hasParticles = false;
				
				this.setMaxParticles = function( m )
				{
					this.maxParticles = m;
				}
				
				this.spawnAndAdd = function()
				{
					var part = typeof this.ps[ this.nextIdx ] != 'undefined' ? this.ps[ this.nextIdx ] : null;
					if( !part ) {
						var x = Math.random() * window.innerWidth/2 -  window.innerWidth/4;
						var y = Math.random() * window.innerHeight/2 -  window.innerHeight/4;	
						var rad = Math.random() * Math.PI * 2;
						var sp = Math.random() * 1.5  + 0.05;
						var dx = Math.sin( rad ) * sp;
						var dy = Math.cos( rad ) * sp;
						part = this.ps[ this.nextIdx ] = new p( x, y, dx, dy );
						part.lifetime = 0;
					}
					else {
						part.lifetime = 1;
						this.hasParticles = true;
					}
					this.nextIdx = ( this.nextIdx + 1 ) % this.maxParticles;
					return part;
				}
				
				this.render = function( ctx, timestamp, timediff )
				{
					if( isNaN( timediff ) ) timediff = 0;
					var tau = Math.PI * 2;
					var l = this.ps.length;
					var rendered = 0;
					for( var i = 0; i < l && i < this.maxParticles; i++ )
					{
						var p = this.ps[ i ];
						if( !p || p.lifetime < 0 ) {
							continue;
						}
						rendered++;
						
						p.x += p.dx * timediff/particlesSpeed;
						p.y += p.dy * timediff/particlesSpeed;
						p.lifetime -= timediff/particlesLifetime/1000;
						
						ctx.rect( Math.floor(p.x-particlesSpawnSize*p.lifetime), Math.floor(p.y-particlesSpawnSize*p.lifetime), 
										1 + (particlesSpawnSize2*p.lifetime), 	1 + (particlesSpawnSize2*p.lifetime));
						
						//if( p.lifetime < 0 /*|| p.x < 0 || p.y < 0 || p.x >= window.innerWidth || p.y >= window.innerHeight*/ )
						//{
						//	p.lifetime = -1;
						//}
					}
					this.renderedParticles = rendered;
					this.hasParticles = rendered > 0;
				}
				
				for( var i = 0; i < this.maxParticles; i++ )
				{
					this.ps[ i ] = this.spawnAndAdd();
				}
			}
			
			var particles = [

			function colorHueRotation()
			{
				this.h = 0;
				
				this.update = function( timestamp, timeDiff )
				{		
					this.h = (timestamp / 30 ) ;
				}
				
				this.getColor = function( p )
				{
					var h = ( this.h + p * 360 );
					return 'hsl( ' + h + ', 100%, 50% )';
				}
				
				this.getParticleColor = function(p)
				{
					var h = ( this.h + p * 360 );
					return 'hsl( ' + (h) + ', 100%, 40% )';
				}
				
				this.getHue = function(p) 
				{
					return (this.h + (p||0) * 360 );	
				}
			}
			
			
			function colorCustom()
			{
				this.col1 = [];
				this.col2 = [];
				
				this.rotationPerc = 0;
				
				this.setColor1 = function( hsl ) 
				{
					this.col1 = hsl;
					if( this.col1[ 1 ] == 0 || this.col1[2] == 0 || this.col1[2] == 1 )
					{
						this.col1[0] = this.col2[0]; // match hue if there is no saturation at all
					}
					if( this.col2[ 1 ] == 0 || this.col2[2] == 0 || this.col2[2] == 1 )
					{
						this.col2[0] = this.col1[0]; // match hue if there is no saturation at all
					}
				}
				
				this.setColor2 = function( hsl ) 
				{
					this.col2 = hsl;
					if( this.col1[ 1 ] == 0 || this.col1[2] == 0 || this.col1[2] == 1 )
					{
						this.col1[0] = this.col2[0]; // match hue if there is no saturation at all
					}
					if( this.col2[ 1 ] == 0 || this.col2[2] == 0 || this.col2[2] == 1 )
					{
						this.col2[0] = this.col1[0]; // match hue if there is no saturation at all
					}
				}
				
				this.update = function( timestamp, timeDiff )
				{		
					this.rotationPerc = (timestamp / ( 30 * 360 ) )%1000;
				}
				
				this.correctP = function( p ) {					
				    //var range = 1;
				    p = (p||0)*2 + this.rotationPerc;
				    //return 0 + Math.abs(((p + range) % (range * 2)) - p);
				    
			        var range = 1 - 0;

			        var multiple = p / range;

			        var asc = Math.floor( p ) % 2 == 0;
			        var modulus = p % range;

			        return asc ? modulus + 0 : 1 - modulus;
			        
				}
				
				this.getColor = function( p )
				{
					p = this.correctP( p );
					var h1 = this.col1[ 0 ];
					var h2 = this.col2[ 0 ];
					var s1 = this.col1[ 1 ];
					var s2 = this.col2[ 1 ];
					var l1 = this.col1[ 2 ];
					var l2 = this.col2[ 2 ];
					if( h1 < h2 - 0.5 ) h1 += 1;
					if( h2 < h1 - 0.5 ) h2 += 1;
					var h = h1 + ( h2 - h1 ) * p;
					var s = s1 + ( s2 - s1 ) * p;
					var l = l1 + ( l2 - l1 ) * p;
					return 'hsl( ' + (h*360) + ', ' + (s*100) + '%, ' + (l*100) + '% )';
					
				}
				
				this.getParticleColor = function(p)
				{
					p = this.correctP( p );
					var h1 = this.col1[ 0 ];
					var h2 = this.col2[ 0 ];
					var s1 = this.col1[ 1 ];
					var s2 = this.col2[ 1 ];
					var l1 = this.col1[ 2 ];
					var l2 = this.col2[ 2 ];
					if( h1 < h2 - 0.5 ) h1 += 1;
					if( h2 < h1 - 0.5 ) h2 += 1;
					var h = h1 + ( h2 - h1 ) * p;
					var s = s1 + ( s2 - s1 ) * p;
					var l = l1 + ( l2 - l1 ) * p;
					return'hsl( ' + (h*360) + ', ' + (s*100) + '%, ' + (l*80) + '% )';
				}
				
				this.getHue = function(p) 
				{
					p = this.correctP( p );
					var h1 = this.col1[ 0 ];
					var h2 = this.col2[ 0 ];
					if( h1 < h2 - 0.5 ) h1 += 1;
					if( h2 < h1 - 0.5 ) h2 += 1;
					return ( h1 + ( h2 - h1 ) * p ) * 360;
				}
			}

			function cosInterpolate( v1, v2, perc )
			{
			  	var mu2 = (1-Math.cos(perc*Math.PI))/2;

				var y2 = y * Math.cos(rad) + x * Math.sin( rad );
				return [x2,y2];
			}

			/**
			 * processing anything regarding frameskipping
			 *
			 * @returns true when should skip
			 **/
			function shouldSkipFrame( timestamp )
			{
				// should we skip this frame?
				
				if( timestamp < nextRenderTimestamp ) {
					return true;
				}
				
				// update time for next frame to render
				var frameInterval = 1000 / targetFramerate;		
				nextRenderTimestamp = Math.floor( timestamp / frameInterval ) * frameInterval + frameInterval;
				return false;
				
			}
			
			/**
			 * measures framerate & updates framerate label
			 **/
			function updateFps( timestamp )
			{ 
				if( timestamp > fpsPrevUpdate + 1000 )
				{
					var diff = ( timestamp - fpsPrevUpdate ) / 1000; // time diff in seconds
					var fps = fpsFrameCount / diff; // adjust framerate to exactly 1 second 
					
					
					var cpuUsage = fpsRenderTime/10/cpuCores + 2; // 10 = 1000ms/10 == 100%;
					cpuUsage *= 1.2;

			/**
			 * called on window/screen resize
			 **/
			function onResize() {
				// update width/height
				width = canvas.width = window.innerWidth;
				height = canvas.height = window.innerHeight;
				width = canvasBg.width = window.innerWidth;
				height = canvasBg.height = window.innerHeight;
			}
			
			/**
			 * called when new fft data is avabile
			 *
			 * @param data Array of 128 floats 
			 **/
			function onAudioData( data ) 
			{
				if( !hasInit ) {
					hasInit = true;
					onInit();
				}
				var t0 = performance.now();
				timer.start('audio update');
				
				try {
					
					// update data in the 2 frames
					frame2.update( data );
					if( !frame2.hasAudio && animateWhenSilent == 1 )
					{
						for( var i = 0; i < 64; i++ ) {
							var p = i / 63;
							var p2 = t0/(60*1000);
							var v = Math.sin( 23 * ( p + p2 ) * Math.PI*2 )+1;
								v += Math.cos( -31 * ( p - p2 ) * Math.PI/3 )/2;
							v/=2;
							data[i] = v;
							data[i+64] = v ;
						}
						frame2.update( data, true );
					}
				}
				catch(ex) { 
					console.error( ex.message );
				}				
				hadAudioFrame = true;
				timer.stop('audio update');
				var t1 = performance.now();
				fpsRenderTime += t1 - t0;
			}

				// start render loop by requesting first frame
				window.requestAnimationFrame( render );
			}
			
			startWp();
		</script>
