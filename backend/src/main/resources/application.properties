# ── 서버 ──
server.port=8080

# ── DB ──
spring.datasource.url=jdbc:mariadb://db:3306/calendar_app?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ── JPA ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ── JWT ──
jwt.secret=your-secret-key-here-must-be-at-least-32-characters-long
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=604800000

# ── 카카오 ──
kakao.client-id=78b683637320e35f5889a035a538ddec
kakao.redirect-uri=http://localhost:5173/auth/callback

# ── 우무(음성 비서) 고정 토큰 발급 허용 계정 ──
# 실제 값은 커밋하지 않고 .env(gitignore됨) -> docker-compose 환경변수로 주입함
device.token-owner-id=${DEVICE_TOKEN_OWNER_ID:}

# ── Ollama ──
ollama.base-url=http://ollama:11434
ollama.default-model=gemma4:26b

# ── STT (로컬 Whisper) ──
whisper.base-url=http://whisper:9000

# ── 파일 업로드 ──
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
file.upload-dir=/workspace/uploads

# ── 공개 파일 링크 (카카오 등 외부 서버가 인증 없이 접근해야 할 때) ──
# 지금은 localhost라 카카오 서버가 실제로 접근은 못 함. 배포 후 실제 도메인(https://...)으로 바꿔줘야 동작함.
app.public-base-url=http://localhost:8080

# ── 기상청 API허브 (단기예보 - 오늘 포함 최대 5일치 기온/강수확률) ──
# 실제 키값은 커밋하지 않고 .env(gitignore됨) -> docker-compose 환경변수(KMA_AUTH_KEY)로 주입함
kma.auth-key=${KMA_AUTH_KEY:}
kma.base-url=https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0/getVilageFcst
# 부산광역시 중구 격자좌표
kma.nx=98
kma.ny=76

# ── 부산광역시 버스정보시스템 (BIMS) - 기본 정류장(ARS번호)의 출근버스 도착정보 ──
# 실제 키값은 커밋하지 않고 .env(gitignore됨) -> docker-compose 환경변수(BUS_BUSAN_SERVICE_KEY)로 주입함
bus.busan.service-key=${BUS_BUSAN_SERVICE_KEY:}
bus.busan.base-url=http://apis.data.go.kr/6260000/BusanBIMS
bus.busan.default-arsno=01088

# ── 이메일 수신 (Cloudflare Email Routing + Worker → 이 서버로 전달) ──
# Cloudflare Worker가 이 값을 X-Inbound-Secret 헤더로 보내야 요청이 통과됨
email.inbound-secret=${EMAIL_INBOUND_SECRET:}

# ── Swagger ──
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.persist-authorization=true
